<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Countdown Timer</title>
        <!-- Google Fonts -->
          <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
            <!-- Bootstrap CSS -->
              <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                <style>
                    body {
                          transition: background 0.3s, color 0.3s;
                                background-color: #000;
                                      color: #fff;
                                            font-family: 'JetBrains Mono', monospace;
                                                  text-align: center;
                                                      }
                                                          .countdown {
                                                                font-size: 10vw;
                                                                      text-align: center;
                                                                            margin-top: 50px;
                                                                                  user-select: none;
                                                                                        width: 100%;
                                                                                            }
                                                                                                .collapse-container {
                                                                                                      position: fixed;
                                                                                                            top: 20px;
                                                                                                                  right: 20px;
                                                                                                                        width: 250px;
                                                                                                                              z-index: 1050;
                                                                                                                                  }
                                                                                                                                      .toggle-btn {
                                                                                                                                            position: fixed;
                                                                                                                                                  top: 20px;
                                                                                                                                                        right: 20px;
                                                                                                                                                              z-index: 1100;
                                                                                                                                                                  }
                                                                                                                                                                      .dark-mode-toggle {
                                                                                                                                                                            position: fixed;
                                                                                                                                                                                  top: 20px;
                                                                                                                                                                                        left: 20px;
                                                                                                                                                                                              z-index: 1100;
                                                                                                                                                                                                  }
                                                                                                                                                                                                    </style>
                                                                                                                                                                                                    </head>
                                                                                                                                                                                                    <body>
                                                                                                                                                                                                      <button class="btn btn-secondary dark-mode-toggle" id="darkModeToggle">☀️</button>

                                                                                                                                                                                                        <button class="btn btn-primary toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#inputCollapse" aria-expanded="false" aria-controls="inputCollapse">
                                                                                                                                                                                                            🕒
                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                <div class="collapse collapse-container" id="inputCollapse">
                                                                                                                                                                                                                    <div class="card card-body">
                                                                                                                                                                                                                          <form id="timeForm">
                                                                                                                                                                                                                                  <div class="mb-3">
                                                                                                                                                                                                                                            <label for="targetTime" class="form-label">Target Time (HH:MM):</label>
                                                                                                                                                                                                                                                      <input type="time" class="form-control" id="targetTime" required>
                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                      <button type="submit" class="btn btn-success w-100" id="setTimer">Set Timer</button>
                                                                                                                                                                                                                                                                            </form>
                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                    <div class="countdown" id="countdown">--:--:--</div>

                                                                                                                                                                                                                                                                                      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                            const countdownEl = document.getElementById('countdown');
                                                                                                                                                                                                                                                                                                const timeForm = document.getElementById('timeForm');
                                                                                                                                                                                                                                                                                                    const targetTimeInput = document.getElementById('targetTime');
                                                                                                                                                                                                                                                                                                        const darkModeToggle = document.getElementById('darkModeToggle');
                                                                                                                                                                                                                                                                                                            let targetDate = null;
                                                                                                                                                                                                                                                                                                                let countdownInterval = null;

                                                                                                                                                                                                                                                                                                                    function updateCountdown() {
                                                                                                                                                                                                                                                                                                                          if (!targetDate) return;
                                                                                                                                                                                                                                                                                                                                const now = new Date();
                                                                                                                                                                                                                                                                                                                                      let diff = Math.max(targetDate - now, 0);

                                                                                                                                                                                                                                                                                                                                            const hours = Math.floor(diff / 3600000);
                                                                                                                                                                                                                                                                                                                                                  diff %= 3600000;
                                                                                                                                                                                                                                                                                                                                                        const minutes = Math.floor(diff / 60000);
                                                                                                                                                                                                                                                                                                                                                              diff %= 60000;
                                                                                                                                                                                                                                                                                                                                                                    const seconds = Math.floor(diff / 1000);

                                                                                                                                                                                                                                                                                                                                                                          countdownEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                  function setTimer(hours, minutes) {
                                                                                                                                                                                                                                                                                                                                                                                        const now = new Date();
                                                                                                                                                                                                                                                                                                                                                                                              targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);
                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                          if (targetDate <= now) {
                                                                                                                                                                                                                                                                                                                                                                                                                  targetDate.setDate(targetDate.getDate() + 1);
                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                              if (countdownInterval) clearInterval(countdownInterval);
                                                                                                                                                                                                                                                                                                                                                                                                                                    updateCountdown();
                                                                                                                                                                                                                                                                                                                                                                                                                                          countdownInterval = setInterval(updateCountdown, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                  function getQueryParams() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        const params = new URLSearchParams(window.location.search);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              const h = params.get('h');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const m = params.get('m');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (h !== null && m !== null) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const hours = parseInt(h, 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const minutes = parseInt(m, 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!isNaN(hours) && !isNaN(minutes) && hours >= 0 && hours < 24 && minutes >= 0 && minutes < 60) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            setTimer(hours, minutes);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  timeForm.addEventListener('submit', (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const timeValue = targetTimeInput.value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!timeValue) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const [targetHours, targetMinutes] = timeValue.split(':').map(Number);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setTimer(targetHours, targetMinutes);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const collapseEl = document.getElementById('inputCollapse');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const bsCollapse = new bootstrap.Collapse(collapseEl, { toggle: false });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  bsCollapse.hide();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          darkModeToggle.addEventListener('click', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (document.body.style.backgroundColor === 'black') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.body.style.backgroundColor = '#fff';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.body.style.color = '#000';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        darkModeToggle.textContent = '🌙';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.body.style.backgroundColor = 'black';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.body.style.color = '#fff';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      darkModeToggle.textContent = '☀️';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.addEventListener("visibilitychange", () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (document.visibilityState === "visible" && targetDate) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  updateCountdown();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                getQueryParams();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
