<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      transition: background 0.3s, color 0.3s;
      background-color: #000;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .countdown {
      font-size: 10vw;
      text-align: center;
      user-select: none;
      width: 100%;
    }
    .controls {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .controls button {
      opacity: 0;
      transition: opacity 0.3s;
    }
    .controls button:hover {
      opacity: 1;
    }
    .collapse-container {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 250px;
      z-index: 1050;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button class="btn btn-secondary dark-mode-toggle" id="darkModeToggle">☀️</button>
    <button class="btn btn-primary toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#inputCollapse" aria-expanded="false" aria-controls="inputCollapse">🕒</button>
  </div>
  <div class="collapse collapse-container" id="inputCollapse">
    <div class="card card-body">
      <form id="timeForm">
        <div class="mb-3">
          <label for="targetTime" class="form-label">Target Time (HH:MM):</label>
          <input type="time" class="form-control" id="targetTime" required>
        </div>
        <button type="submit" class="btn btn-success w-100" id="setTimer">Set Timer</button>
      </form>
    </div>
  </div>
  <div class="countdown" id="countdown">--:--:--</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const countdownEl = document.getElementById('countdown');
    const timeForm = document.getElementById('timeForm');
    const targetTimeInput = document.getElementById('targetTime');
    const darkModeToggle = document.getElementById('darkModeToggle');
    let targetDate = null;
    let countdownInterval = null;

    window.onload = () => {
      countdownEl.textContent = '--:--:--';
    };

    darkModeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      if (document.body.classList.contains('light-mode')) {
        document.body.style.backgroundColor = '#fff';
        document.body.style.color = '#000';
        darkModeToggle.textContent = '🌙';
      } else {
        document.body.style.backgroundColor = '#000';
        document.body.style.color = '#fff';
        darkModeToggle.textContent = '☀️';
      }
    });

    timeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const timeValue = targetTimeInput.value;
      if (!timeValue) return;

      const [targetHours, targetMinutes] = timeValue.split(':').map(Number);
      const now = new Date();
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), targetHours, targetMinutes, 0);

      if (targetDate <= now) {
        targetDate.setDate(targetDate.getDate() + 1);
      }

      if (countdownInterval) clearInterval(countdownInterval);
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);

      const collapseEl = document.getElementById('inputCollapse');
      const bsCollapse = new bootstrap.Collapse(collapseEl, { toggle: false });
      bsCollapse.hide();
    });

    function updateCountdown() {
      if (!targetDate) return;
      const now = new Date();
      let diff = Math.max(targetDate - now, 0);

      const hours = Math.floor(diff / 3600000);
      diff %= 3600000;
      const minutes = Math.floor(diff / 60000);
      diff %= 60000;
      const seconds = Math.floor(diff / 1000);

      countdownEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
